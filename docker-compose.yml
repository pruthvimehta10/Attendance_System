version: '3.8'
services:
  web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=development
      - PORT=${PORT:-5000}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///attendance.db}
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
    volumes:
      - .:/app
    command: gunicorn --bind 0.0.0.0:${PORT:-5000} app:create_app()
