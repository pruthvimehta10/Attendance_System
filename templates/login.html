<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Modern Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b1b 100%);
        }

        .glass-card {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            color: #fff;
            transition: box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 15px 45px rgba(220, 53, 69, 0.15);
        }

        .glass-card h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            padding: 12px 15px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(220, 53, 69, 0.5);
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.15);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #adb5bd;
        }

        .btn-primary {
            background: #dc3545;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: #c82333;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .alert {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .alert-success {
            background: rgba(40, 167, 69, 0.1);
            border-color: rgba(40, 167, 69, 0.2);
            color: #51cf66;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h3>System Login</h3>
        {% with messages = get_flashed_messages(with_categories=true) %} 
            {% if messages %} 
                {% for category, msg in messages %}
                <div class="alert alert-{{category}}">{{ msg }}</div>
                {% endfor %} 
            {% endif %} 
        {% endwith %}

        <form method="post">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input class="form-control" type="email" name="email" placeholder="student@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" placeholder="••••••••" required>
            </div>
            <button class="btn-primary" type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
